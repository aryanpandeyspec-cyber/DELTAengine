<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DELTA ENGINE - Role Portal Login</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Josefin+Sans:wght@600;700&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Styling -->
  <link rel="stylesheet" href="app.css">
  <script src="components/customCursor.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #ffffff 0%, #faecd9 100%);
      padding: 20px;
      font-family: var(--font-main, 'Inter', sans-serif);
    }

    .login-container {
      width: 100%;
      max-width: 480px;
      z-index: 10;
      position: relative;
    }

    .login-card {
      background: #ffffff !important;
      border: 4px solid #000000 !important;
      border-radius: 24px !important;
      box-shadow: 12px 12px 0px #000000 !important;
      padding: 36px 32px !important;
    }

    .login-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .login-logo {
      height: 86px;
      margin-bottom: 12px;
      object-fit: contain;
      mix-blend-mode: darken;
    }

    .login-title {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: #000000;
      margin: 0;
    }

    .login-subtitle {
      font-family: var(--font-main, 'Inter', sans-serif);
      font-size: 0.9rem;
      color: #475569;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Tabs Styling */
    .auth-role-tabs {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 10px !important;
      margin-bottom: 18px !important;
    }

    .auth-tab-btn {
      font-family: var(--font-main, 'Inter', sans-serif) !important;
      font-weight: 800 !important;
      font-size: 0.92rem !important;
      padding: 12px 14px !important;
      border: 3px solid #000000 !important;
      border-radius: 12px !important;
      background: #f1f5f9 !important;
      color: #334155 !important;
      box-shadow: 3px 3px 0px #000000 !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
      text-align: center !important;
    }

    .auth-tab-btn:hover {
      background: #e2e8f0 !important;
      transform: translate(-1px, -1px) !important;
      box-shadow: 4px 4px 0px #000000 !important;
    }

    .auth-tab-btn.active {
      background: #2563eb !important;
      color: #ffffff !important;
      box-shadow: 4px 4px 0px #000000 !important;
      transform: translate(-1px, -1px) !important;
    }

    /* Google Button */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: #ffffff;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 14px;
      font-family: var(--font-main, 'Inter', sans-serif);
      font-weight: 800;
      font-size: 0.92rem;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.15s ease;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .google-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
      background: #f8fafc;
    }

    .google-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .google-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0 16px 0;
      font-family: var(--font-mono, monospace);
      font-size: 0.72rem;
      font-weight: 800;
      color: #64748b;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 2px dashed #cbd5e1;
    }

    .auth-divider span {
      padding: 0 12px;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group.is-hidden {
      display: none !important;
    }

    .form-label {
      display: block !important;
      font-family: var(--font-main, 'Inter', sans-serif) !important;
      font-size: 0.82rem !important;
      font-weight: 800 !important;
      color: #0f172a !important;
      margin-bottom: 6px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
    }

    .form-control {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box !important;
      padding: 12px 14px !important;
      font-family: var(--font-main, 'Inter', sans-serif) !important;
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      color: #000000 !important;
      background: #ffffff !important;
      border: 3px solid #000000 !important;
      border-radius: 12px !important;
      box-shadow: 4px 4px 0px #000000 !important;
      outline: none !important;
      transition: all 0.15s ease !important;
    }

    .form-control:focus {
      border-color: #2563eb !important;
      box-shadow: 5px 5px 0px #2563eb !important;
      transform: translate(-1px, -1px) !important;
    }

    .form-control::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    .password-wrap {
      position: relative;
      width: 100%;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px;
      color: #64748b;
      user-select: none;
    }

    .password-toggle-btn:hover {
      color: #0f172a;
    }

    /* Submit Button */
    .auth-submit-btn {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 100% !important;
      padding: 14px 20px !important;
      font-family: var(--font-main, 'Inter', sans-serif) !important;
      font-size: 1.05rem !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      background: #2563eb !important;
      border: 3px solid #000000 !important;
      border-radius: 14px !important;
      box-shadow: 4px 4px 0px #000000 !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
      margin-top: 6px !important;
      margin-bottom: 16px !important;
    }

    .auth-submit-btn:hover {
      background: #1d4ed8 !important;
      transform: translate(-2px, -2px) !important;
      box-shadow: 6px 6px 0px #000000 !important;
    }

    .auth-submit-btn:active {
      transform: translate(2px, 2px) !important;
      box-shadow: 2px 2px 0px #000000 !important;
    }

    .auth-submit-btn:disabled {
      opacity: 0.65 !important;
      cursor: not-allowed !important;
      transform: none !important;
    }
  </style>
</head>

<body>

  <!-- Background Levitating Doodles -->
  <div class="decorations">
    <img src="doodles/yazg.png" class="doodle-img doodle-yazg" alt="Doodle YAZG">
    <img src="doodles/5003155.png" class="doodle-img doodle-500" alt="Doodle 5003155">
    <img src="doodles/2057748.png" class="doodle-img doodle-205" alt="Doodle 2057748">
    <img src="doodles/15711543.png" class="doodle-img doodle-157" alt="Doodle 15711543">
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="logo.jpeg" class="login-logo delta-polymorphic-logo" alt="DELTA ENGINE Logo">
        <h1 class="login-title"><span class="title-delta">DELTA</span> <span class="title-engine">ENGINE</span></h1>
        <p class="login-subtitle">Venue Operations & Incident Management</p>
      </div>

      <!-- Mode Selection Tabs: Sign In / Create Account -->
      <div class="auth-role-tabs mb-4">
        <button id="tab-login-coordinator" class="auth-tab-btn active" type="button">Sign In</button>
        <button id="tab-login-admin" class="auth-tab-btn" type="button">Create Account</button>
      </div>

      <!-- Google Sign-In via Supabase Auth -->
      <button id="btn-google-login" class="google-btn" type="button">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        Sign in with Google
      </button>

      <div class="auth-divider">
        <span>OR CONTINUE WITH EMAIL</span>
      </div>

      <!-- Real-Time Error Banner -->
      <div id="auth-error-banner" style="display:none; background:#fef2f2; border:3px solid #ef4444; border-radius:12px; padding:12px 14px; margin-bottom:16px; color:#b91c1c; font-size:0.86rem; font-weight:700; font-family:var(--font-mono, monospace); line-height:1.4; box-shadow:3px 3px 0px #ef4444;">
        ⚠️ <span id="auth-error-text">Authentication failed.</span>
      </div>

      <!-- Real-Time Success Banner -->
      <div id="auth-success-banner" style="display:none; background:#ecfdf5; border:3px solid #10b981; border-radius:12px; padding:12px 14px; margin-bottom:16px; color:#047857; font-size:0.86rem; font-weight:700; font-family:var(--font-mono, monospace); line-height:1.4; box-shadow:3px 3px 0px #10b981;">
        ✅ <span id="auth-success-text">Operation completed successfully.</span>
      </div>

      <form id="standalone-login-form">
        <input type="hidden" id="auth-selected-role" value="coordinator">

        <!-- Full Name (Only shown in Create Account mode) -->
        <div class="form-group is-hidden" id="reg-name-group" style="display:none !important;">
          <label class="form-label" for="input-fullname">Full Name</label>
          <input type="text" id="input-fullname" class="form-control" placeholder="Enter your full name" autocomplete="name">
        </div>

        <!-- Email Identifier -->
        <div class="form-group">
          <label class="form-label" id="username-label" for="input-username">Email Address</label>
          <input type="email" id="input-username" class="form-control" placeholder="Enter your email address" required autocomplete="email">
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" id="password-label" for="input-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="input-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 42px;">
            <button type="button" id="btn-toggle-password" class="password-toggle-btn" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Role Select (Only shown in Create Account mode) -->
        <div class="form-group is-hidden" id="reg-role-group" style="display:none !important;">
          <label class="form-label" for="input-new-role">Account Role</label>
          <select id="input-new-role" class="form-control">
            <option value="COORDINATOR">Event Operations Coordinator</option>
            <option value="SAFETY_DIRECTOR">Safety & Life-Safety Director</option>
            <option value="VOLUNTEER">Field Marshal / Crowd Volunteer</option>
          </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit-login" class="auth-submit-btn">
          Sign In
        </button>

        <!-- Security Badge -->
        <div style="background:#f8fafc; border:2px solid #000000; border-radius:12px; padding:12px; font-size:0.75rem; text-align:center; font-family:var(--font-mono, monospace); line-height:1.5; box-shadow:3px 3px 0px #000000;">
          🔒 <strong>Secure Access</strong><br>
          <span style="color:#64748b;">Role-based permissions with encrypted session tokens</span>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- SUPABASE CLIENT INITIALIZATION ---
    const SUPABASE_URL = 'https://frlrazzskbzmtlqrswjl.supabase.co';
    const SUPABASE_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_bcmjO-FDpberqg7vt94Etw_0pSElRbx';
    const supabaseClient = (window.supabase && SUPABASE_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let authMode = 'login'; // 'login' | 'register'
    let selectedRole = 'coordinator';

    const tabCoord = document.getElementById('tab-login-coordinator');
    const tabAdmin = document.getElementById('tab-login-admin');
    const usernameLabel = document.getElementById('username-label');
    const passwordLabel = document.getElementById('password-label');
    const inputUsername = document.getElementById('input-username');
    const inputPassword = document.getElementById('input-password');
    const inputFullname = document.getElementById('input-fullname');
    const inputNewRole = document.getElementById('input-new-role');
    const regNameGroup = document.getElementById('reg-name-group');
    const regRoleGroup = document.getElementById('reg-role-group');
    const errorBanner = document.getElementById('auth-error-banner');
    const errorText = document.getElementById('auth-error-text');
    const successBanner = document.getElementById('auth-success-banner');
    const successText = document.getElementById('auth-success-text');
    const btnSubmitLogin = document.getElementById('btn-submit-login');
    const btnTogglePassword = document.getElementById('btn-toggle-password');

    // Switch to Sign In Mode
    tabCoord.addEventListener('click', (e) => {
      e.preventDefault();
      authMode = 'login';
      tabCoord.classList.add('active');
      tabAdmin.classList.remove('active');
      regNameGroup.classList.add('is-hidden');
      regRoleGroup.classList.add('is-hidden');
      regNameGroup.style.setProperty('display', 'none', 'important');
      regRoleGroup.style.setProperty('display', 'none', 'important');
      usernameLabel.textContent = 'Email Address';
      inputUsername.placeholder = 'Enter your email address';
      passwordLabel.textContent = 'Password';
      inputPassword.placeholder = 'Enter your password';
      btnSubmitLogin.innerHTML = 'Sign In';
      hideError();
      hideSuccess();
    });

    // Switch to Create Account Mode
    tabAdmin.addEventListener('click', (e) => {
      e.preventDefault();
      authMode = 'register';
      tabAdmin.classList.add('active');
      tabCoord.classList.remove('active');
      regNameGroup.classList.remove('is-hidden');
      regRoleGroup.classList.remove('is-hidden');
      regNameGroup.style.setProperty('display', 'flex', 'important');
      regRoleGroup.style.setProperty('display', 'flex', 'important');
      usernameLabel.textContent = 'Email Address';
      inputUsername.placeholder = 'Enter your email address';
      passwordLabel.textContent = 'Create Password (min 6 characters)';
      inputPassword.placeholder = 'Create your password (min 6 chars)';
      btnSubmitLogin.innerHTML = 'Create Account';
      hideError();
      hideSuccess();
    });

    // Password Visibility Toggle
    btnTogglePassword.addEventListener('click', () => {
      if (inputPassword.type === 'password') {
        inputPassword.type = 'text';
        btnTogglePassword.textContent = '🙈';
      } else {
        inputPassword.type = 'password';
        btnTogglePassword.textContent = '👁️';
      }
    });

    function showError(msg) {
      if (errorBanner && errorText) {
        errorText.textContent = msg;
        errorBanner.style.display = 'block';
      }
      hideSuccess();
    }

    function hideError() {
      if (errorBanner) errorBanner.style.display = 'none';
    }

    function showSuccess(msg) {
      if (successBanner && successText) {
        successText.textContent = msg;
        successBanner.style.display = 'block';
      }
      hideError();
    }

    function hideSuccess() {
      if (successBanner) successBanner.style.display = 'none';
    }

    // Handle incoming OAuth callback parameters in URL
    async function handleOAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);

      // Check if redirected due to remote administrative session revocation
      if (urlParams.get('revoked') === 'true') {
        window.history.replaceState({}, document.title, window.location.pathname);
        showError('⛔ Your active terminal session was revoked by the System Administrator. Please re-authenticate.');
        fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
        return;
      }
      const hashRaw = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
      const hashParams = new URLSearchParams(hashRaw);

      const error = urlParams.get('error') || hashParams.get('error');
      const errorDescription = urlParams.get('error_description') || hashParams.get('error_description');

      if (error || errorDescription) {
        window.history.replaceState({}, document.title, window.location.pathname);
        const cleanMsg = errorDescription ? decodeURIComponent(errorDescription.replace(/\+/g, ' ')) : error;
        showError(`Supabase OAuth Notice: ${cleanMsg}. Please use your registered email and password below.`);
        return;
      }

      const accessToken = hashParams.get('access_token') || urlParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token') || urlParams.get('refresh_token');
      const code = urlParams.get('code');

      if (accessToken || code) {
        window.history.replaceState({}, document.title, window.location.pathname);
        showSuccess('Verifying Supabase OAuth credentials...');
        try {
          const res = await fetch('/api/auth/oauth-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessToken, refreshToken, code })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            showError(data?.error || 'Failed to authenticate via Supabase OAuth.');
            return;
          }
          localStorage.setItem('delta_auth_token', data.token);
          const verifiedRole = (data.user?.role || 'COORDINATOR').toLowerCase();
          localStorage.setItem('delta_user_role', verifiedRole);
          localStorage.setItem('delta_user_name', data.user?.name || 'OAuth Operator');
          showSuccess('Authenticated via Supabase OAuth! Redirecting...');
          setTimeout(() => {
            window.location.href = verifiedRole === 'admin' ? 'admin.html' : 'index.html';
          }, 500);
        } catch (err) {
          showError('OAuth session exchange failed: ' + err.message);
        }
      }
    }

    handleOAuthCallback();

    // Google Login via Supabase Auth
    document.getElementById('btn-google-login').addEventListener('click', async () => {
      const btn = document.getElementById('btn-google-login');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ Verifying Google OAuth Provider...';
      hideError();
      hideSuccess();

      try {
        const checkRes = await fetch('/api/auth/provider-status?provider=google');
        const checkData = await checkRes.json();

        if (!checkData.enabled) {
          btn.disabled = false;
          btn.innerHTML = originalText;
          showError(
            `Google OAuth is currently not enabled in this Supabase project (frlrazzskbzmtlqrswjl). ` +
            `Please sign in or create an account above using your email and password.`
          );
          if (inputUsername) inputUsername.focus();
          return;
        }

        if (supabaseClient) {
          const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/login.html' }
          });
          if (error) throw error;
        } else {
          showError('Supabase client is offline. Please sign in with email/password.');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        showError('Google OAuth error: ' + err.message);
      }
    });

    // Form Submission: Sign In or Register
    document.getElementById('standalone-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      hideSuccess();

      let identifier = inputUsername.value.trim();
      const password = inputPassword.value.trim();

      // Normalize common typo (e.g. @gmai -> @gmail.com)
      if (identifier.endsWith('@gmai')) identifier += 'l.com';
      else if (identifier.endsWith('@gmail')) identifier += '.com';
      inputUsername.value = identifier;

      if (!identifier || !password) {
        showError('Please fill in both your email address and password.');
        return;
      }

      btnSubmitLogin.disabled = true;

      if (authMode === 'register') {
        const fullname = inputFullname.value.trim() || identifier.split('@')[0];
        const newRole = inputNewRole.value || 'COORDINATOR';

        if (password.length < 6) {
          showError('Password must be at least 6 characters long for Supabase Auth.');
          btnSubmitLogin.disabled = false;
          return;
        }

        btnSubmitLogin.innerHTML = '⏳ Creating Account in Supabase...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: identifier, password, name: fullname, role: newRole })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            const errMsg = data?.error || 'Registration failed.';
            if (errMsg.toLowerCase().includes('already registered')) {
              showError('An account with this email already exists. Switch to "Sign In" above to log in.');
            } else {
              showError(errMsg);
            }
            btnSubmitLogin.disabled = false;
            btnSubmitLogin.innerHTML = '⚡ Create Account & Launch';
            return;
          }

          showSuccess('Account registered successfully in Supabase! Logging you in...');
          setTimeout(() => {
            proceedToPortal(newRole.toLowerCase(), identifier, password);
          }, 600);
        } catch (err) {
          showError('Registration request failed: ' + err.message);
          btnSubmitLogin.disabled = false;
          btnSubmitLogin.innerHTML = '⚡ Create Account & Launch';
        }
      } else {
        btnSubmitLogin.innerHTML = '⏳ Verifying Credentials...';
        await proceedToPortal(selectedRole, identifier, password);
        btnSubmitLogin.disabled = false;
        btnSubmitLogin.innerHTML = '🚀 Sign In to Delta Engine';
      }
    });

    async function proceedToPortal(role, username, password = '') {
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role, username, email: username, password })
        });
        const data = await res.json();

        if (!res.ok || (data && !data.success)) {
          showError(data?.error || 'Invalid credentials. Please verify your Supabase email and password.');
          return;
        }

        if (data && data.token) {
          localStorage.setItem('delta_auth_token', data.token);
          const verifiedRole = (data.user?.role || 'COORDINATOR').toLowerCase();
          const verifiedName = data.user?.name || username;
          localStorage.setItem('delta_user_role', verifiedRole);
          localStorage.setItem('delta_user_name', verifiedName);

          if (supabaseClient && data.supabaseSession?.accessToken) {
            try {
              await supabaseClient.auth.setSession({
                access_token: data.supabaseSession.accessToken,
                refresh_token: ''
              });
            } catch (e) {}
          }

          showSuccess(`Authenticated as ${verifiedName} (${verifiedRole.toUpperCase()})! Redirecting...`);

          setTimeout(() => {
            if (verifiedRole === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 400);
        } else {
          showError('Authentication succeeded but no secure token was returned.');
        }
      } catch (err) {
        console.warn('[Login Portal] Network error during auth:', err.message);
        showError('Network error connecting to authentication server.');
      }
    }
  </script>
</body>

</html>
