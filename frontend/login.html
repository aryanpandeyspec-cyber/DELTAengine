<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DELTA ENGINE - Role Portal Login</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Josefin+Sans:wght@600;700&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Styling -->
  <link rel="stylesheet" href="app.css">
  <script src="components/customCursor.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #ffffff 0%, #faecd9 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 480px;
      z-index: 10;
      position: relative;
    }

    .login-card {
      background: #ffffff !important;
      border: 4px solid #000000 !important;
      border-radius: 24px !important;
      box-shadow: 12px 12px 0px #000000 !important;
      padding: 36px 32px !important;
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-logo {
      height: 90px;
      margin-bottom: 12px;
      object-fit: contain;
      mix-blend-mode: darken;
    }

    .login-title {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #000000;
      margin: 0;
    }

    .login-subtitle {
      font-family: var(--font-main);
      font-size: 0.92rem;
      color: #555555;
      font-weight: 600;
      margin-top: 4px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: #ffffff;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 14px;
      font-family: var(--font-main);
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.15s ease;
      margin-bottom: 20px;
    }

    .google-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
      background: #f8f9fa;
    }

    .google-icon {
      width: 22px;
      height: 22px;
    }
  </style>
</head>

<body>

  <!-- Background Levitating Doodles -->
  <div class="decorations">
    <img src="doodles/yazg.png" class="doodle-img doodle-yazg" alt="Doodle YAZG">
    <img src="doodles/5003155.png" class="doodle-img doodle-500" alt="Doodle 5003155">
    <img src="doodles/2057748.png" class="doodle-img doodle-205" alt="Doodle 2057748">
    <img src="doodles/15711543.png" class="doodle-img doodle-157" alt="Doodle 15711543">
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="logo.jpeg" class="login-logo delta-polymorphic-logo" alt="DELTA ENGINE Logo">
        <h1 class="login-title"><span class="title-delta">DELTA</span> <span class="title-engine">ENGINE</span></h1>
        <p class="login-subtitle">Role Access Portal & Event OS Authentication</p>
      </div>

      <!-- Top Mode Selection Tabs -->
      <div class="auth-role-tabs mb-4">
        <button id="tab-login-coordinator" class="auth-tab-btn active">👤 Sign In (Supabase)</button>
        <button id="tab-login-admin" class="auth-tab-btn">⚡ Create Operator Account</button>
      </div>

      <!-- Google Sign-In via Supabase Auth -->
      <button id="btn-google-login" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        Sign in with Google (Supabase Auth)
      </button>

      <div class="auth-demo-divider" style="margin: 18px 0 16px 0;">
        <span>SUPABASE POSTGRESQL AUTHENTICATION</span>
      </div>

      <!-- Real-Time Authentication Error Banner -->
      <div id="auth-error-banner" style="display:none; background:#fef2f2; border:2px solid #ef4444; border-radius:8px; padding:10px 14px; margin-bottom:14px; color:#b91c1c; font-size:0.85rem; font-weight:700; font-family:var(--font-mono, monospace);">
        ⚠️ <span id="auth-error-text">Authentication failed.</span>
      </div>

      <!-- Real-Time Success Banner -->
      <div id="auth-success-banner" style="display:none; background:#ecfdf5; border:2px solid #10b981; border-radius:8px; padding:10px 14px; margin-bottom:14px; color:#047857; font-size:0.85rem; font-weight:700; font-family:var(--font-mono, monospace);">
        ✅ <span id="auth-success-text">Account created successfully!</span>
      </div>

      <form id="standalone-login-form">
        <input type="hidden" id="auth-selected-role" value="coordinator">

        <!-- Extra Name Field for Registration Mode -->
        <div class="form-group mb-3" id="reg-name-group" style="display:none;">
          <label class="form-label" style="font-weight:700;">Full Name</label>
          <input type="text" id="input-fullname" class="form-control" placeholder="e.g. Marcus Aurelius"
            style="border:2px solid #000; border-radius:10px; font-weight:600;">
        </div>

        <div class="form-group mb-3">
          <label class="form-label" id="username-label" style="font-weight:700;">Operator Email / Identifier</label>
          <input type="text" id="input-username" class="form-control" placeholder="e.g. admin@delta-engine.in or coordinator@delta-engine.in" required
            style="border:2px solid #000; border-radius:10px; font-weight:600;">
        </div>

        <div class="form-group mb-4">
          <label class="form-label" style="font-weight:700;">Account Password</label>
          <input type="password" id="input-password" class="form-control" placeholder="Enter your Supabase password" required
            style="border:2px solid #000; border-radius:10px; font-weight:600;">
        </div>

        <!-- Role Select for Registration Mode -->
        <div class="form-group mb-3" id="reg-role-group" style="display:none;">
          <label class="form-label" style="font-weight:700;">Assigned Role</label>
          <select id="input-new-role" class="form-control" style="border:2px solid #000; border-radius:10px; font-weight:700;">
            <option value="COORDINATOR">Event Operations Coordinator</option>
            <option value="ADMIN">Super Admin & Incident Commander</option>
            <option value="SAFETY_DIRECTOR">Safety & Life-Safety Director</option>
          </select>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-blue w-full btn-md mb-3"
          style="font-size:1.05rem; font-weight:800; border:2px solid #000; box-shadow:3px 3px 0px #000;">
          🚀 Sign In with Supabase
        </button>

        <div style="background:#f8fafc; border:2px solid #000; border-radius:8px; padding:10px; font-size:0.75rem; text-align:center; font-family:var(--font-mono, monospace); line-height:1.4;">
          🔒 <strong>Official Supabase Auth (PostgreSQL DB)</strong><br>
          <span style="color:#64748b;">Enterprise RBAC & Signed JWT Verification</span>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- SUPABASE CLIENT INITIALIZATION ---
    const SUPABASE_URL = 'https://frlrazzskbzmtlqrswjl.supabase.co';
    const SUPABASE_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_bcmjO-FDpberqg7vt94Etw_0pSElRbx';
    const supabaseClient = (window.supabase && SUPABASE_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let authMode = 'login'; // 'login' | 'register'
    let selectedRole = 'coordinator';

    const tabCoord = document.getElementById('tab-login-coordinator');
    const tabAdmin = document.getElementById('tab-login-admin');
    const usernameLabel = document.getElementById('username-label');
    const inputUsername = document.getElementById('input-username');
    const inputPassword = document.getElementById('input-password');
    const inputFullname = document.getElementById('input-fullname');
    const inputNewRole = document.getElementById('input-new-role');
    const regNameGroup = document.getElementById('reg-name-group');
    const regRoleGroup = document.getElementById('reg-role-group');
    const hiddenRole = document.getElementById('auth-selected-role');
    const errorBanner = document.getElementById('auth-error-banner');
    const errorText = document.getElementById('auth-error-text');
    const successBanner = document.getElementById('auth-success-banner');
    const successText = document.getElementById('auth-success-text');
    const btnSubmitLogin = document.getElementById('btn-submit-login');

    tabCoord.addEventListener('click', (e) => {
      e.preventDefault();
      authMode = 'login';
      tabCoord.classList.add('active');
      tabAdmin.classList.remove('active');
      regNameGroup.style.display = 'none';
      regRoleGroup.style.display = 'none';
      btnSubmitLogin.textContent = '🚀 Sign In with Supabase';
      hideError();
      hideSuccess();
    });

    tabAdmin.addEventListener('click', (e) => {
      e.preventDefault();
      authMode = 'register';
      tabAdmin.classList.add('active');
      tabCoord.classList.remove('active');
      regNameGroup.style.display = 'block';
      regRoleGroup.style.display = 'block';
      btnSubmitLogin.textContent = '⚡ Register New Operator';
      hideError();
      hideSuccess();
    });

    function showError(msg) {
      if (errorBanner && errorText) {
        errorText.textContent = msg;
        errorBanner.style.display = 'block';
      }
      hideSuccess();
    }

    function hideError() {
      if (errorBanner) errorBanner.style.display = 'none';
    }

    function showSuccess(msg) {
      if (successBanner && successText) {
        successText.textContent = msg;
        successBanner.style.display = 'block';
      }
      hideError();
    }

    function hideSuccess() {
      if (successBanner) successBanner.style.display = 'none';
    }

    // Google Login via Supabase
    document.getElementById('btn-google-login').addEventListener('click', async () => {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/index.html' }
          });
          if (error) throw error;
        } catch (err) {
          console.log('[Supabase OAuth Notice] Redirecting to portal:', err.message);
          proceedToPortal('coordinator', 'Google Auth User', 'oauth_token');
        }
      } else {
        proceedToPortal('coordinator', 'Google User', 'oauth_token');
      }
    });

    document.getElementById('standalone-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      hideSuccess();
      const identifier = inputUsername.value.trim();
      const password = inputPassword.value.trim();

      if (!identifier || !password) {
        showError('Please fill in both your email and password.');
        return;
      }

      btnSubmitLogin.disabled = true;

      if (authMode === 'register') {
        const fullname = inputFullname.value.trim() || identifier.split('@')[0];
        const newRole = inputNewRole.value || 'COORDINATOR';
        btnSubmitLogin.textContent = '⏳ Registering in Supabase...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: identifier, password, name: fullname, role: newRole })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            showError(data?.error || 'Registration failed.');
            btnSubmitLogin.disabled = false;
            btnSubmitLogin.textContent = '⚡ Register New Operator';
            return;
          }
          showSuccess('Account registered! Signing you in...');
          setTimeout(() => {
            proceedToPortal(newRole.toLowerCase(), identifier, password);
          }, 800);
        } catch (err) {
          showError('Registration network failure: ' + err.message);
          btnSubmitLogin.disabled = false;
          btnSubmitLogin.textContent = '⚡ Register New Operator';
        }
      } else {
        btnSubmitLogin.textContent = '⏳ Verifying via Supabase Auth...';
        await proceedToPortal(selectedRole, identifier, password);
        btnSubmitLogin.disabled = false;
        btnSubmitLogin.textContent = '🚀 Sign In with Supabase';
      }
    });

    async function proceedToPortal(role, username, password = '') {
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role, username, email: username, password })
        });
        const data = await res.json();
        
        if (!res.ok || (data && !data.success)) {
          showError(data?.error || 'Invalid Supabase credentials. Access denied.');
          return;
        }

        if (data && data.token) {
          localStorage.setItem('delta_auth_token', data.token);
          localStorage.setItem('delta_user_role', data.user?.role?.toLowerCase() || role);
          localStorage.setItem('delta_user_name', data.user?.name || username);
        } else {
          localStorage.setItem('delta_user_role', role);
          localStorage.setItem('delta_user_name', username);
        }

        if (role === 'admin' || data.user?.role === 'ADMIN') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.warn('[Login Portal] Network error during auth:', err.message);
        showError('Network connection error. Server offline.');
      }
    }
  </script>
</body>

</html>
